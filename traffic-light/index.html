<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My First Traffic Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a lab bench. The 3D workbench fills the left, the lesson card sits on the right; they stack on phones. */
:root {
  --bg: #E3EBF0;
  --surface: #FFFFFF;
  --surface-2: #F1F5F8;
  --ink: #15202A;
  --muted: #526170;
  --line: #D2DCE3;
  --accent: #0A7480;
  --accent-strong: #075A63;
  --accent-soft: #DAEEF0;
  --red: #C93131;
  --amber: #A86D00;
  --amber-lamp: #FFB400;
  --green: #16834A;
  --hl: #F2B705;
  --ground: #2E3136;
  --code-bg: #13202A;
  --code-ink: #E3ECF1;
  --code-dim: #8BA0AE;
  --code-hl: #24404F;
  --font-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --font-code: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  padding: 12px 16px 16px;
  gap: 12px;
}

/* ---------- header ---------- */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 20px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1.05;
  margin: 0;
  letter-spacing: -0.01em;
}
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.stages {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-left: auto;
}
.stage-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 12px 4px 4px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
}
.stage-pill b {
  display: grid;
  place-items: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--surface-2);
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--muted);
}
.stage-pill.done { color: var(--ink); }
.stage-pill.done b { background: var(--accent-soft); color: var(--accent-strong); }
.stage-pill.current { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.stage-pill.current b { background: var(--accent); color: #fff; }
.progress { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.progress .bar {
  flex: 1;
  height: 8px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  overflow: hidden;
}
.progress .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.progress span { font-weight: 700; font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- main ---------- */
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(320px, 410px);
  gap: 14px;
  min-height: 0;
}
.viewport {
  position: relative;
  min-height: 0;
  border-radius: 18px;
  overflow: hidden;
  background: #F3F7FA;
  border: 1px solid var(--line);
}
#scene, #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#scene canvas { touch-action: none; cursor: grab; }
#scene canvas:active { cursor: grabbing; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.lbl { position: absolute; left: 0; top: 0; width: 0; height: 0; --lift: 10px; will-change: transform; color: var(--ink); }
.lbl > span {
  position: absolute;
  left: 0; bottom: var(--lift);
  transform: translateX(-50%);
  white-space: nowrap;
  background: rgba(255,255,255,.94);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 2px 8px;
  font-weight: 800;
  font-size: 12.5px;
  box-shadow: 0 2px 8px rgba(21,32,42,.12);
  display: inline-flex; align-items: center; gap: 6px;
}
.lbl::after {
  content: '';
  position: absolute;
  left: -1px; bottom: 0;
  width: 2px; height: var(--lift);
  background: rgba(21,32,42,.45);
}
.lbl .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.25); }
.lbl.lamp.on > span { color: #fff; border-color: transparent; }
.lbl.lamp.on.red > span { background: var(--red); }
.lbl.lamp.on.yellow > span { background: var(--amber-lamp); color: var(--ink); }
.lbl.lamp.on.green > span { background: var(--green); }
.lbl.pin > span { font-family: var(--font-code); font-size: 11.5px; padding: 1px 6px; }
.lbl.pin.high > span { background: var(--hl); border-color: transparent; }
.lbl.callout > span { background: var(--ink); color: #fff; border-color: transparent; font-size: 13px; }
.lbl.callout::after { background: var(--ink); }
.lbl.callout.gold > span { background: var(--hl); color: var(--ink); }
.lbl.callout.blue > span { background: #2F6FDE; }
.lbl.callout.ground > span { background: var(--ground); }

.status {
  position: absolute;
  top: 12px; left: 12px;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 14px 8px 8px;
  box-shadow: 0 4px 14px rgba(21,32,42,.1);
}
.lamps {
  display: grid; gap: 4px;
  background: #2B3038;
  padding: 5px;
  border-radius: 10px;
}
.lamps i { width: 14px; height: 14px; border-radius: 50%; background: #4A515B; }
.lamps i.on[data-k="red"] { background: #FF4141; box-shadow: 0 0 10px #FF4141; }
.lamps i.on[data-k="yellow"] { background: var(--amber-lamp); box-shadow: 0 0 10px var(--amber-lamp); }
.lamps i.on[data-k="green"] { background: #22D36B; box-shadow: 0 0 10px #22D36B; }
.st-text { display: grid; line-height: 1.2; }
.st-text b { font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; }
.st-text small { color: var(--muted); font-weight: 700; font-size: 12.5px; }
.st-count {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 30px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  min-width: 2.2ch;
  text-align: right;
}
.st-count small { font-size: 14px; color: var(--muted); margin-left: 2px; }
.st-badge {
  font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  background: var(--hl); color: var(--ink); border-radius: 6px; padding: 1px 6px;
}

.reset-view {
  position: absolute;
  top: 12px; right: 12px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 10px 18px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(10,116,128,.35);
}
.reset-view:hover { background: var(--accent-strong); }
.reset-view svg { width: 18px; height: 18px; }

.cycle {
  position: absolute;
  left: 12px; right: 12px; bottom: 40px;
  max-width: 520px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px 8px 8px;
  box-shadow: 0 4px 14px rgba(21,32,42,.08);
}
.cycle-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); padding: 0 2px 4px; font-variant-numeric: tabular-nums; }
.cycle-track { position: relative; display: flex; gap: 3px; height: 26px; }
.cycle-track > div {
  border-radius: 6px;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800; color: #fff;
  overflow: hidden; white-space: nowrap;
  transition: flex-grow .4s;
  opacity: .55;
}
.cycle-track > div.on { opacity: 1; }
.seg-red { background: var(--red); }
.seg-green { background: var(--green); }
.seg-yellow { background: var(--amber-lamp); color: var(--ink) !important; }
.cycle-marker {
  position: absolute; top: -4px; bottom: -4px; width: 3px;
  background: var(--ink); border-radius: 2px;
  box-shadow: 0 0 0 2px #fff;
}

.live {
  position: absolute;
  left: 50%; top: 70px;
  transform: translateX(-50%);
  max-width: calc(100% - 24px);
  background: var(--ink); color: #fff;
  border-radius: 999px;
  padding: 6px 16px;
  font-weight: 700; font-size: 14px;
  text-align: center;
  box-shadow: 0 6px 16px rgba(21,32,42,.25);
}
.hint {
  position: absolute; left: 12px; bottom: 10px; margin: 0;
  font-size: 12px; font-weight: 700; color: var(--muted);
  pointer-events: none;
}

.info {
  position: absolute;
  right: 12px; bottom: 40px;
  width: min(330px, calc(100% - 24px));
  background: var(--surface);
  border: 2px solid var(--hl);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: 0 10px 26px rgba(21,32,42,.18);
}
.info h3 { font-family: var(--font-display); font-size: 19px; margin: 0 28px 2px 0; line-height: 1.2; }
.info p { margin: 4px 0 0; }
.info .purpose { font-weight: 800; }
.info .more { color: var(--muted); font-size: 14px; }
.info .close {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface-2);
  cursor: pointer; font-weight: 800;
}

/* ---------- lesson panel ---------- */
.panel {
  display: flex; flex-direction: column;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
}
.panel-body { flex: 1; overflow: auto; padding: 16px; display: grid; gap: 14px; align-content: start; min-height: 0; }
.guide { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 10px; align-items: start; }
.guide svg { width: 58px; height: 70px; }
.bubble {
  position: relative;
  background: var(--surface-2);
  border-radius: 14px;
  padding: 10px 14px 12px;
}
.bubble::before {
  content: ''; position: absolute; left: -8px; top: 22px;
  border: 8px solid transparent; border-left: 0; border-right-color: var(--surface-2);
}
.eyebrow { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.bubble h2 { font-family: var(--font-display); font-size: 23px; line-height: 1.15; margin: 2px 0 6px; text-wrap: balance; }
.bubble p.text { margin: 0; font-size: 16px; }
.term { font-weight: 800; color: var(--accent-strong); }

.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.card h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; }
.list li.on { background: var(--accent-soft); }
.chip-lamp { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.chip-lamp.red { background: var(--red); }
.chip-lamp.yellow { background: var(--amber-lamp); }
.chip-lamp.green { background: var(--green); }
.list .secs { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.check {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 900; color: transparent;
}
.done .check { background: var(--green); border-color: var(--green); color: #fff; }
.list li.now { background: #FFF6D6; outline: 2px solid var(--hl); }
.list li.part-item { cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.list li.part-item:hover { background: var(--surface-2); }
.mono { font-family: var(--font-code); font-size: 13px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.note.safety { background: #FFF6D6; border-radius: 10px; padding: 8px 10px; color: var(--ink); }
.legend { display: grid; gap: 6px; font-size: 14px; }
.legend div { display: flex; gap: 8px; align-items: center; }
.sw { width: 26px; height: 10px; border-radius: 3px; flex: none; }

/* code */
.code-card { border-radius: 14px; overflow: hidden; background: var(--code-bg); color: var(--code-ink); }
.code-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px; background: #0D171F; }
.code-head span { font-family: var(--font-code); font-size: 12.5px; color: var(--code-dim); }
.code-btns { display: flex; gap: 6px; }
.code-btns button {
  border: 1px solid #36505F; background: #1C2E3A; color: var(--code-ink);
  border-radius: 8px; padding: 4px 10px; font-weight: 800; font-size: 13px; cursor: pointer;
}
.code-btns button.on { background: var(--hl); color: var(--ink); border-color: var(--hl); }
pre.code {
  margin: 0;
  padding: 8px 0;
  font-family: var(--font-code);
  font-size: 12.5px;
  line-height: 1.6;
  max-height: 44vh;
  overflow: auto;
  position: relative;
}
pre.code .ln { display: block; padding: 0 12px 0 0; white-space: pre; border-left: 4px solid transparent; }
pre.code .ln::before { content: attr(data-n); display: inline-block; width: 3.2ch; margin-right: 1.2ch; text-align: right; color: #4E6676; }
pre.code .ln.hl { background: var(--code-hl); border-left-color: var(--hl); }
pre.code .ln.hl.key { background: #2E5468; }
pre.code .c { color: #8FA8B5; font-style: italic; }
pre.code .kw { color: #7FD3E0; }
pre.code .fn { color: #FFD479; }
pre.code .k2 { color: #FF9BB0; font-weight: 600; }
pre.code .num { color: #B6E68A; }
pre.code .num.flash { background: var(--hl); color: var(--ink); border-radius: 3px; }
pre.code .tick {
  margin-left: 10px; font-family: var(--font-body); font-weight: 800; font-size: 11.5px;
  background: var(--hl); color: var(--ink); border-radius: 6px; padding: 0 6px;
}
.code-note { margin: 0; padding: 8px 14px 10px; font-size: 13.5px; color: var(--code-ink); border-top: 1px solid #22323D; }
.code-note b { color: #FFD479; }

/* experiment */
.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input { flex: 1; accent-color: var(--green); min-width: 0; height: 28px; }
.slider-val { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--green); min-width: 3.4ch; text-align: right; font-variant-numeric: tabular-nums; }
.ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; padding: 0 2px; }
.sum { margin: 8px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.question { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.25; margin: 0 0 8px; }
.reveal { margin-top: 8px; background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }

.quiz-opts { display: grid; gap: 8px; }
.quiz-opts button {
  text-align: left; border: 2px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 700;
  display: flex; gap: 10px; align-items: flex-start;
}
.quiz-opts button:hover { border-color: var(--accent); }
.quiz-opts button b { font-family: var(--font-display); color: var(--accent); }
.quiz-opts button.right { border-color: var(--green); background: #E3F5EA; }
.quiz-opts button.wrong { border-color: var(--red); background: #FBE7E7; }
.feedback { border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
.feedback.good { background: #E3F5EA; }
.feedback.try { background: #FFF6D6; }
.feedback b { font-family: var(--font-display); font-size: 18px; }

/* footer controls */
.panel-foot { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 10px; background: var(--surface); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 9px 12px; font-weight: 800; font-size: 14px; cursor: pointer;
  flex: 1 1 auto;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.warn { color: var(--red); }
.btn.armed { background: var(--red); color: #fff; border-color: var(--red); }
.btn[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); }
.toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-weight: 800; font-size: 14px; cursor: pointer; flex: 1 1 auto; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 700; }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  main { grid-template-columns: minmax(0, 1fr); }
  .viewport { height: 58vh; min-height: 360px; }
  .panel-body { overflow: visible; }
  .stages { margin-left: 0; }
  .stage-pill span { display: none; }
  .stage-pill { padding-right: 4px; }
  .progress { flex: 1 1 100%; }
  .status { padding: 6px 10px 6px 6px; gap: 8px; }
  .st-text b { font-size: 16px; }
  .st-count { font-size: 24px; }
  .reset-view { padding: 8px 12px; font-size: 14px; }
  .hint { display: none; }
  .cycle { bottom: 10px; }
  .info { bottom: 74px; }
  pre.code { max-height: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="54" viewBox="0 0 34 54" aria-hidden="true">
        <rect x="3" y="2" width="28" height="50" rx="9" fill="#2B3038"/>
        <circle cx="17" cy="13" r="6" fill="#FF4141"/>
        <circle cx="17" cy="27" r="6" fill="#FFB400"/>
        <circle cx="17" cy="41" r="6" fill="#22D36B"/>
      </svg>
      <div>
        <h1>My First Traffic Light</h1>
        <p>Build it, wire it and code it, one step at a time</p>
      </div>
    </div>
    <nav class="stages" id="stages" aria-label="Lesson stages"></nav>
    <div class="progress" aria-live="polite">
      <div class="bar" role="progressbar" aria-label="Lesson progress" id="progressBar" aria-valuemin="0" aria-valuemax="100"><i id="progressFill"></i></div>
      <span id="progressText">Step 1 of 14</span>
    </div>
  </header>

  <main>
    <section class="viewport" id="viewport" aria-label="3D workbench">
      <div id="scene"></div>
      <div class="labels" id="labels"></div>
      <div class="status" id="status" aria-live="polite">
        <div class="lamps" aria-hidden="true"><i data-k="red"></i><i data-k="yellow"></i><i data-k="green"></i></div>
        <div class="st-text"><b id="stName">RED</b><small id="stWord">Stop</small></div>
        <div class="st-count" id="stCount">5<small>s</small></div>
        <span class="st-badge" id="stBadge" hidden>Paused</span>
      </div>
      <button class="reset-view" id="resetView" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Reset view
      </button>
      <div class="live" id="live" hidden></div>
      <div class="cycle" id="cycle" hidden>
        <div class="cycle-head"><span>One full cycle</span><span id="cycleTotal">12 s</span></div>
        <div class="cycle-track" id="cycleTrack">
          <div class="seg-red" data-p="0">Red 5 s</div>
          <div class="seg-green" data-p="1">Green 5 s</div>
          <div class="seg-yellow" data-p="2">Yellow 2 s</div>
          <i class="cycle-marker" id="cycleMarker"></i>
        </div>
      </div>
      <div class="info" id="info" hidden role="dialog" aria-labelledby="infoTitle">
        <button class="close" id="infoClose" type="button" aria-label="Close">✕</button>
        <h3 id="infoTitle"></h3>
        <p class="purpose" id="infoPurpose"></p>
        <p class="more" id="infoMore"></p>
      </div>

<script>

/* =========================================================

const P = 0.25;
const colX = (c) => (c - 15.5) * P;

const RAIL_COLS = [];
for (let c = 1; c <= 30; c++) if ((c - 1) % 6 !== 0) RAIL_COLS.push(c);
const HEADER_Z = -3.85, HEADER_TOP = 0.6, SLEEVE = 0.27;

const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0 }, o));
function mesh(geo, m, x = 0, y = 0, z = 0, shadow = true) {

function rod(a, b, r, m) {

/* ---------- breadboard ---------- */
function breadboardTexture(W, D) {
  const S = 180;
  const c = document.createElement('canvas');
  c.width = Math.round(W * S); c.height = Math.round(D * S);
  const g = c.getContext('2d');
  const U = (x) => (x + W / 2) * S, Z = (z) => (z + D / 2) * S;
  g.fillStyle = '#f8f8f4'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#dcddd5'; g.fillRect(0, Z(-0.13), c.width, 0.26 * S);
  const line = (z, col) => { g.fillStyle = col; g.fillRect(U(colX(1) - 0.2), Z(z) - 0.014 * S, (colX(30) - colX(1) + 0.4) * S, 0.028 * S); };
  line(-2.42, '#2f6fde'); line(-1.76, '#d93b3b'); line(1.76, '#d93b3b'); line(2.42, '#2f6fde');
  const hole = (x, z) => { const s = 0.1 * S; g.fillStyle = '#41464c'; roundRect(g, U(x) - s / 2, Z(z) - s / 2, s, s, s * 0.22); g.fill(); };
  for (let col = 1; col <= 30; col++) for (const r in ROWZ) hole(colX(col), ROWZ[r]);
  for (const col of RAIL_COLS) { hole(colX(col), POS_RAIL_Z); hole(colX(col), NEG_RAIL_Z); hole(colX(col), -1.95); hole(colX(col), -2.2); }
  g.fillStyle = '#6f7a85'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `700 ${0.115 * S}px Nunito, Arial, sans-serif`;
  for (let col = 1; col <= 30; col++) { g.fillText(String(col), U(colX(col)), Z(-1.58)); g.fillText(String(col), U(colX(col)), Z(1.58)); }
  for (const r in ROWZ) { g.fillText(r, U(colX(0)), Z(ROWZ[r])); g.fillText(r, U(colX(31)), Z(ROWZ[r])); }
  g.font = `800 ${0.2 * S}px Nunito, Arial, sans-serif`;
  const sign = (t, col, z, fillc) => { g.fillStyle = fillc; g.fillText(t, U(colX(col)), Z(z)); };
  sign('−', 0, NEG_RAIL_Z, '#2f6fde'); sign('−', 31, NEG_RAIL_Z, '#2f6fde');
  sign('+', 0, POS_RAIL_Z, '#d93b3b'); sign('+', 31, POS_RAIL_Z, '#d93b3b');
  sign('−', 0, -2.2, '#2f6fde'); sign('+', 0, -1.95, '#d93b3b');
  sign('−', 31, -2.2, '#2f6fde'); sign('+', 31, -1.95, '#d93b3b');
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeBreadboard() {
  const g = new THREE.Group();
  const W = 8.4, D = 5.3, H = 0.4;
  g.add(mesh(new THREE.BoxGeometry(W, H, D), mat(0xf2f2ec, { roughness: 0.8 }), 0, -H / 2 - 0.001, 0));
  const top = mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ map: breadboardTexture(W, D), roughness: 0.85 }), 0, 0.001, 0, false);
  top.rotation.x = -Math.PI / 2;
  g.add(top);
  tagPart(g, 'breadboard');
  return g;
}

/* ---------- controller board ---------- */
function arduinoTexture(W, D, cx, cz) {
  const S = 180;
  const c = document.createElement('canvas');
  c.width = Math.round(W * S); c.height = Math.round(D * S);
  const g = c.getContext('2d');
  const U = (x) => (x - cx + W / 2) * S, Z = (z) => (z - cz + D / 2) * S;
  g.fillStyle = '#10808d'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3;
  roundRect(g, 10, 10, c.width - 20, c.height - 20, 30); g.stroke();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `italic 800 ${0.9 * S}px Nunito, Arial, sans-serif`;
  g.fillText('UNO', U(-1.6), Z(-6.0));
  g.font = `800 ${0.2 * S}px Nunito, Arial, sans-serif`;
  g.fillText('CONTROLLER BOARD', U(-1.6), Z(-5.35));
  g.font = `800 ${0.17 * S}px Nunito, Arial, sans-serif`;
  g.fillText('DIGITAL (PWM ~)', U(-1.1), Z(-4.62));
  g.fillText('POWER', U(-0.2), Z(-8.05));
  g.fillText('ANALOG IN', U(-2.27), Z(-8.05));
  g.font = `800 ${0.13 * S}px Nunito, Arial, sans-serif`;
  for (let k = 0; k <= 7; k++) g.fillText(String(k), U(-2.95 + k * P), Z(-4.26));
  for (let k = 0; k <= 5; k++) g.fillText(String(8 + k), U(-0.8 + k * P), Z(-4.26));
  const vert = (t, x, z) => { g.save(); g.translate(U(x), Z(z)); g.rotate(-Math.PI / 2); g.textAlign = 'right'; g.fillText(t, 0, 0); g.restore(); };
  vert('GND', 0.7, -4.17); vert('AREF', 0.95, -4.17); vert('SDA', 1.2, -4.17); vert('SCL', 1.45, -4.17);
  // highlight the three pins we use
  g.strokeStyle = '#F2B705'; g.lineWidth = 5;
  roundRect(g, U(-0.8 - 0.13), Z(-4.4), 0.76 * S, 0.28 * S, 10); g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

}

  g.add(mesh(new THREE.BoxGeometry(3.5, 0.14, 0.75), black, -0.4, y + 0.11, -6.9));
  for (let k = 0; k < 14; k++) {
    g.add(mesh(new THREE.BoxGeometry(0.06, 0.1, 0.12), metal, -2.0 + k * 0.245, y + 0.06, -6.47, false));
    g.add(mesh(new THREE.BoxGeometry(0.06, 0.1, 0.12), metal, -2.0 + k * 0.245, y + 0.06, -7.33, false));
  }
  g.add(mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.14, 16), mat(0xe8e8e8, { metalness: 0.5, roughness: 0.3 }), -3.0, y + 0.1, -5.0));
  g.add(mesh(new THREE.BoxGeometry(0.5, 0.12, 0.5), mat(0xb3b8bd), -3.0, y + 0.07, -5.0));
  g.add(mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.6, 16), mat(0x2b2f36), 1.9, y + 0.34, -7.9));
  g.add(mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.6, 16), mat(0x2b2f36), 1.25, y + 0.34, -7.9));

/* ---------- LED ---------- */
function flangeGeometry(r, h) {
  const s = new THREE.Shape();
  const cut = 0.8 * r, a = Math.acos(cut / r);
  s.absarc(0, 0, r, a, Math.PI * 2 - a, false);
  s.lineTo(cut, r * Math.sin(a));
  const geo = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 28 });
  geo.rotateX(-Math.PI / 2);
  return geo;
}
let glowTexture = null;
function getGlowTexture() {
  if (glowTexture) return glowTexture;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.25, 'rgba(255,255,255,.55)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  glowTexture = new THREE.CanvasTexture(c);
  return glowTexture;
}
function makeLED(hex, scale = 1, legs = [0.5, 0.5], spread = P) {
  const g = new THREE.Group();
  const s = scale;
  const leg = mat(0xc9ced4, { metalness: 0.3, roughness: 0.35 });
  const legTop = 0.45 * s;
  const anode = rod(V(0, legTop - legs[0] * s, 0), V(0, legTop, 0), 0.018 * s, leg);
  const cathode = rod(V(spread, legTop - legs[1] * s, 0), V(spread, legTop, 0), 0.018 * s, leg);
  g.add(anode, cathode);
  const body = mat(hex, { transparent: true, opacity: 0.8, roughness: 0.22, emissive: hex, emissiveIntensity: 0.06 });
  const cx = spread / 2;
  const flange = mesh(flangeGeometry(0.29 * s, 0.06 * s), body, cx, legTop, 0);
  const barrel = mesh(new THREE.CylinderGeometry(0.25 * s, 0.25 * s, 0.32 * s, 28), body, cx, legTop + 0.06 * s + 0.16 * s, 0);
  const dome = mesh(new THREE.SphereGeometry(0.25 * s, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), body, cx, legTop + 0.38 * s, 0);
  g.add(flange, barrel, dome);
  const light = new THREE.PointLight(hex, 0, 4.5 * s, 2);
  light.position.set(cx, legTop + 0.4 * s, 0);
  g.add(light);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: getGlowTexture(), color: hex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.scale.set(1.7 * s, 1.7 * s, 1);
  glow.position.set(cx, legTop + 0.35 * s, 0);
  g.add(glow);
  g.userData.led = { body, light, glow, base: new THREE.Color(hex), dim: new THREE.Color(hex).lerp(new THREE.Color(0x6b7280), 0.55) };
  body.color.copy(g.userData.led.dim);
  return g;
}

/* ---------- resistor (330 Ω: orange, orange, brown, gold) ---------- */
function makeResistor() {
  const g = new THREE.Group();
  const lead = mat(0xc9ced4, { metalness: 0.3, roughness: 0.35 });
  const zA = ROWZ.d, zB = ROWZ.g, yb = 0.3, half = 0.27;
  g.add(rod(V(0, -0.05, zA), V(0, yb, zA), 0.016, lead));
  g.add(rod(V(0, -0.05, zB), V(0, yb, zB), 0.016, lead));
  g.add(rod(V(0, yb, zA), V(0, yb, -half), 0.016, lead));
  g.add(rod(V(0, yb, half), V(0, yb, zB), 0.016, lead));
  const bodyMat = mat(0xd8c08e, { roughness: 0.5 });
  const body = mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.42, 20), bodyMat, 0, yb, 0);
  body.rotation.x = Math.PI / 2;
  g.add(body);
  for (const z of [-0.2, 0.2]) g.add(mesh(new THREE.SphereGeometry(0.1, 16, 12), bodyMat, 0, yb, z));
  const bands = [[-0.17, 0xf08a24], [-0.08, 0xf08a24], [0.01, 0x7a4a22], [0.17, 0xc9a227]];
  for (const [z, col] of bands) {
    const b = mesh(new THREE.CylinderGeometry(0.094, 0.094, 0.045, 20), mat(col, { roughness: 0.4, metalness: col === 0xc9a227 ? 0.6 : 0 }), 0, yb, z);
    b.rotation.x = Math.PI / 2;
    g.add(b);
  }
  return g;
}

/* ---------- jumper wire ---------- */
const SEGS = 120, RADIAL = 10;
function makeWire(points, color) {
  const g = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geo = new THREE.TubeGeometry(curve, SEGS, 0.045, RADIAL, false);
  const tube = mesh(geo, mat(color, { roughness: 0.45 }));
  g.add(tube);
  const sleeveMat = mat(0x24272c, { roughness: 0.5 });
  const pinMat = metal;
  const ends = [];
  for (const p of [points[0], points[points.length - 1]]) {
    const e = new THREE.Group();
    e.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, SLEEVE, 12), sleeveMat, p.x, p.y - SLEEVE / 2, p.z));
    e.add(mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.12, 8), pinMat, p.x, p.y - SLEEVE - 0.05, p.z));
    g.add(e); ends.push(e);
  }
  const w = { group: g, curve, geo, ends, progress: 1 };
  w.set = (f) => {
    w.progress = f;
    geo.setDrawRange(0, Math.floor(f * SEGS) * RADIAL * 6);
    ends[0].visible = f > 0;
    ends[1].visible = f >= 1;
  };
  tagPart(g, 'wire');
  return w;
}

/* ---------- traffic-light housing ---------- */
const HOUSING = { W: 6.4, H: 1.1, y0: 0.62, zF: 1.68, zB: 0.8 };
function makeHousing() {
  const g = new THREE.Group();
  const { W, H, y0, zF, zB } = HOUSING;

function buildFlowPath(i) {
  const ch = CH[i], x = colX(ch.col), xc = colX(ch.col + 1);

  pts.push(...pinWires[i].curve.getPoints(50));
  pts.push(V(x, 0.03, ROWZ.b), V(x, 0.03, ROWZ.d), V(x, 0.3, ROWZ.d), V(x, 0.3, ROWZ.g), V(x, 0.03, ROWZ.g),

  pts.push(...cathodeWires[i].curve.getPoints(16));
  pts.push(V(xc, 0.03, NEG_RAIL_Z), V(colX(30), 0.03, NEG_RAIL_Z));
  pts.push(...gndWire.curve.getPoints(60).reverse());
  pts.push(pinAt('GND', 0.6));
  const cum = [0];
  for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + pts[k].distanceTo(pts[k - 1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
const flowPaths = CH.map((_, i) => buildFlowPath(i));
const DOTS = 26;
const dotMat = new THREE.MeshBasicMaterial({ color: 0xffd23f, depthTest: false, transparent: true, opacity: 0.95 });
const dots = [];
for (let k = 0; k < DOTS; k++) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), dotMat);
  d.renderOrder = 10; d.visible = false;
  scene.add(d); dots.push(d);
}
let flowOn = false, flowOffset = 0;
function pointAlong(path, s) {
  const { pts, cum } = path;
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m; else hi = m; }
  const seg = cum[hi] - cum[lo] || 1;
  return pts[lo].clone().lerp(pts[hi], (s - cum[lo]) / seg);
}
function updateFlow(dt) {
  const show = flowOn && litIndex != null && litIndex >= 0;
  dots.forEach((d) => { d.visible = show; });
  if (!show) return;
  const path = flowPaths[litIndex];
  flowOffset = (flowOffset + dt * 1.7) % path.len;
  const gap = path.len / DOTS;
  dots.forEach((d, k) => d.position.copy(pointAlong(path, (flowOffset + k * gap) % path.len)));
}

/* =========================================================
   Tweens (step animations respect Pause; camera does not)
   ========================================================= */
let token = 0, paused = false, tweens = [];
const easeInOut = (f) => f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
const easeOut = (f) => 1 - Math.pow(1 - f, 3);
const speed = reduceMotion ? 0.35 : 1;
function tween(dur, fn, t, ease = easeInOut) {
  return new Promise((res) => tweens.push({ e: 0, dur: Math.max(0.001, dur * speed), fn, ease, t, res }));
}
const wait = (dur, t) => new Promise((res) => tweens.push({ e: 0, dur: Math.max(0.001, dur), fn: () => {}, ease: (f) => f, t, res }));
function updateTweens(dt) {
  const keep = [];
  for (const tw of tweens) {
    if (tw.t !== token) continue;
    tw.e += dt;
    const f = Math.min(1, tw.e / tw.dur);
    tw.fn(tw.ease(f));
    if (f >= 1) tw.res(); else keep.push(tw);
  }
  tweens = keep;
}
function fadeOut(g, dur, t) {
  return tween(dur, (f) => g.traverse((o) => { if (o.material && o.userData.o0 != null) o.material.opacity = o.userData.o0 * (1 - f); }), t);
}

function flyTo(key, instant) {
  const c = CAM[key];

  const aspect = camera.aspect;
  if (aspect < 1.25) {

  }

}
function updateCam(dt) {

  camera.position.lerpVectors(camTw.fp, camTw.to.p, f);

}

/* =========================================================
   Traffic-light sequence: red 5 s → green (2–10 s) → yellow 2 s
   ========================================================= */
const DEFAULT_GREEN = 5;
let greenDur = DEFAULT_GREEN;
const PHASES = [{ ch: 0, block: 'p0' }, { ch: 2, block: 'p1' }, { ch: 1, block: 'p2' }];
const phaseDur = (k) => [5, greenDur, 2][k];
const seq = { running: false, phase: 0, remaining: 5, manual: false };
function startSeq() { seq.running = true; seq.phase = 0; seq.remaining = phaseDur(0); seq.manual = false; }
function updateSeq(dt) {
  if (!seq.running) { setLights(-1); return; }
  if (!seq.manual) {
    seq.remaining -= dt;
    while (seq.remaining <= 0) {
      seq.phase = (seq.phase + 1) % 3;
      seq.remaining += phaseDur(seq.phase);
    }
  }
  setLights(PHASES[seq.phase].ch);
}
function stepPhase() {
  if (!seq.running) startSeq();

function updateCodeHighlight() {
  if (!codeCard.isConnected) return;
  let block = codeOverride ? codeOverride.block : null;
  let only = codeOverride ? codeOverride.line : null;
  if (!codeOverride && seq.running) block = PHASES[seq.phase].block;

    card.querySelector('#revealBtn').addEventListener('click', (e) => {
      revealOpen = !revealOpen;
      card.querySelector('#revealBox').hidden = !revealOpen;
      e.currentTarget.textContent = revealOpen ? 'Hide the answer' : 'Think first, then show the answer';
      e.currentTarget.setAttribute('aria-expanded', String(revealOpen));
    });
    extra.appendChild(card);
  }
  if (s.code) {
    codeCard.querySelector('#stepper').hidden = !s.stepper;
    refreshStepper();
    lastCodeKey = '';
    if (!s.play) setCodeNote('');
    extra.appendChild(codeCard);
  }
  if (s.extra === 'E1') updateSumLine();
  if (s.extra === 'E2') extra.appendChild(renderQuiz());
}
function updateSumLine() {
  const v = $('#greenVal'), sl = $('#sumLine');
  if (v) v.textContent = greenDur + ' s';
  if (sl) sl.textContent = `One full cycle: 5 + ${greenDur} + 2 = ${7 + greenDur} seconds`;
  const gs = $('#greenSecs');
  if (gs) gs.textContent = greenDur + ' s';
}
const QUIZ = {
  q: 'Why does each LED need a resistor?',
  opts: [
    'So the LED can change colour',
    'To limit the current and help protect the LED',
    'To store the program for the lights',
    'To make the jumper wires longer',
  ],
  right: 1,
};
function renderQuiz() {
  const card = el(`<div class="card"><p class="question">${QUIZ.q}</p><div class="quiz-opts" role="group" aria-label="Answers"></div><div id="quizFb" aria-live="polite"></div></div>`);
  const box = card.querySelector('.quiz-opts');
  QUIZ.opts.forEach((txt, k) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<b>${'ABCD'[k]}</b><span>${txt}</span>`;
    if (quiz.choice === k) b.classList.add(k === QUIZ.right ? 'right' : 'wrong');
    if (quiz.solved && k === QUIZ.right) b.classList.add('right');
    b.addEventListener('click', () => { quiz.choice = k; if (k === QUIZ.right) quiz.solved = true; const n = renderQuiz(); card.replaceWith(n); });
    box.appendChild(b);
  });
  const fb = card.querySelector('#quizFb');
  if (quiz.choice != null) {
    if (quiz.choice === QUIZ.right) {
      fb.innerHTML = `<div class="feedback good"><b>Yes, great thinking!</b><p style="margin:4px 0 0">A resistor limits how much current flows. Without one, too much current could flow through the LED and damage it or the controller pin. Each LED has its own resistor, so each light is protected on its own.</p><p style="margin:6px 0 0"><b style="font-size:16px">You finished the lesson!</b> You built a circuit and controlled it with code.</p></div>`;
    } else {
      fb.innerHTML = `<div class="feedback try"><b>Good try!</b><p style="margin:4px 0 0">That is not the job of a resistor. Hint: look back at what the resistor does to the flow of electricity. Pick another answer.</p></div>`;
    }
  }
  return card;
}

/* ---------- header progress ---------- */
const stagesNav = $('#stages');
STAGES.forEach((st, k) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'stage-pill';
  b.innerHTML = `<b>${st.letter}</b><span>${st.name}</span>`;
  b.setAttribute('aria-label', `Stage ${st.letter}: ${st.name}`);
  b.addEventListener('click', () => goTo(STEPS.findIndex((s) => s.stage === k)));
  stagesNav.appendChild(b);
});
function updateNav() {
  const s = STEPS[stepIndex];
  [...stagesNav.children].forEach((b, k) => {
    b.classList.toggle('current', k === s.stage);
    b.classList.toggle('done', k < s.stage);
    if (k === s.stage) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  const pct = Math.round(((stepIndex + 1) / STEPS.length) * 100);
  $('#progressFill').style.width = pct + '%';
  $('#progressBar').setAttribute('aria-valuenow', String(pct));
  $('#progressText').textContent = `Step ${stepIndex + 1} of ${STEPS.length}`;
  $('#prev').disabled = stepIndex === 0;
  $('#next').disabled = stepIndex === STEPS.length - 1;
  const st = STAGES[s.stage];
  $('#stageName').textContent = `Stage ${st.letter} · ${st.name}`;
  $('#stepTitle').textContent = s.title;
  $('#stepText').innerHTML = s.text;
}

/* ---------- selection / info card ---------- */
let selHelper = null;
const info = $('#info');
function clearSelection() {
  if (selHelper) { scene.remove(selHelper); selHelper.geometry.dispose(); selHelper = null; }
}
function hideInfo() { info.hidden = true; clearSelection(); }
function selectPart(part, obj) {
  clearSelection();
  if (!obj) {
    const candidates = pickables.filter((o) => o.userData.part === part && visibleInScene(o));
    obj = candidates[0] || null;
  }
  if (obj) {
    selHelper = new THREE.BoxHelper(obj, 0xf2b705);
    selHelper.material.depthTest = false;
    selHelper.material.transparent = true;
    selHelper.renderOrder = 8;
    selHelper.userData.target = obj;
    scene.add(selHelper);
  }
  const d = PART_INFO[part];
  $('#infoTitle').textContent = d.name;
  $('#infoPurpose').textContent = d.purpose;
  $('#infoMore').textContent = d.more;
  info.hidden = false;
  if (CORE_PARTS.includes(part) && !partsFound.has(part)) {
    partsFound.add(part);
    const li = document.querySelector(`#partList [data-part="${part}"]`);
    if (li) li.classList.add('done');
    const fc = $('#foundCount');
    if (fc) fc.textContent = String(partsFound.size);
    if (partsFound.size === 5 && STEPS[stepIndex].extra === 'B1') caption('You found all five parts! Click Next.');
  }
}
$('#infoClose').addEventListener('click', hideInfo);

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables.filter(visibleInScene), true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.part) o = o.parent;
    if (o && visibleInScene(o)) { selectPart(o.userData.part, o); return; }
  }
});

/* =========================================================
   Navigation
   ========================================================= */
let housingTarget = 0, bigLedTarget = 0, copWave = 0;
function goTo(i, opt = {}) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  token++;
  const t = token;
  tweens = [];
  clearTemps();
  hideInfo();
  caption('');
  const prev = STEPS[stepIndex];
  stepIndex = i;
  const s = STEPS[i];
  const built = new Set(s.build || ALL_PARTS);
  ALL_PARTS.forEach((id) => setPart(id, built.has(id)));
  housingTarget = s.housing ? 0 : 4.5;
  bigLedTarget = s.bigLed ? 1 : 0;
  flowOn = !!s.flow;
  showPinStates = !!s.pinStates;
  codeOverride = null;
  if (s.seq) {
    if (!seq.running || opt.replay || !prev.seq) startSeq();
    seq.manual = false;
  } else {
    seq.running = false; seq.manual = false;
    setLights(-1);
  }
  updateNav();
  renderExtra(s);
  flyTo(s.cam, opt.instant);
  copWave = 1.8;
  $('#panelBody').scrollTop = 0;
  if (s.play) s.play(t);
}

$('#prev').addEventListener('click', () => goTo(stepIndex - 1));
$('#next').addEventListener('click', () => goTo(stepIndex + 1));
$('#replay').addEventListener('click', () => goTo(stepIndex, { replay: true }));
$('#resetView').addEventListener('click', () => flyTo(STEPS[stepIndex].cam));
$('#labelsToggle').addEventListener('change', (e) => { showLabels = e.target.checked; });
const pauseBtn = $('#pause');
function setPaused(p) {
  paused = p;
  pauseBtn.setAttribute('aria-pressed', String(p));
  pauseBtn.textContent = p ? '▶ Resume' : '❚❚ Pause';
}
pauseBtn.addEventListener('click', () => setPaused(!paused));
const resetBtn = $('#resetLesson');
let resetArmed = null;
resetBtn.addEventListener('click', () => {
  if (!resetArmed) {
    resetBtn.classList.add('armed');
    resetBtn.textContent = 'Click again to reset';
    resetArmed = setTimeout(() => { resetArmed = null; resetBtn.classList.remove('armed'); resetBtn.textContent = 'Reset lesson'; }, 3000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  resetBtn.classList.remove('armed'); resetBtn.textContent = 'Reset lesson';
  resetLesson();
});
function resetLesson() {
  greenDur = DEFAULT_GREEN;
  const gm = codeCard.querySelector('#greenMs'); if (gm) gm.textContent = String(DEFAULT_GREEN * 1000);
  partsFound.clear();
  quiz = { choice: null, solved: false };
  revealOpen = false;
  setPaused(false);
  showLabels = true; $('#labelsToggle').checked = true;
  seq.running = false;
  stepIndex = 0;
  goTo(0, { replay: true });
  updateCycle(true);
}
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if (e.key === 'ArrowRight' && stepIndex < STEPS.length - 1) goTo(stepIndex + 1);
  if (e.key === 'ArrowLeft' && stepIndex > 0) goTo(stepIndex - 1);
});

/* ---------- status chip + cycle bar ---------- */
const stName = $('#stName'), stWord = $('#stWord'), stCount = $('#stCount'), stBadge = $('#stBadge');
const lampEls = [...document.querySelectorAll('.lamps i')];
const cycleEl = $('#cycle'), cycleSegs = [...document.querySelectorAll('#cycleTrack > div')], cycleMarker = $('#cycleMarker');
let lastStatus = '';
function updateCycle(force) {
  const durs = [5, greenDur, 2];
  if (force) {
    cycleSegs.forEach((d, k) => {
      d.style.flexGrow = String(durs[k]);
      d.textContent = `${['Red', 'Green', 'Yellow'][k]} ${durs[k]} s`;
    });
    $('#cycleTotal').textContent = `${7 + greenDur} s`;
  }
}
function updateStatus() {
  const running = seq.running;
  const ch = running ? CH[PHASES[seq.phase].ch] : null;
  const secs = running ? Math.max(1, Math.ceil(seq.remaining - 1e-6)) : 0;
  const key = `${running}|${seq.phase}|${secs}|${paused}|${seq.manual}`;
  if (key !== lastStatus) {
    lastStatus = key;
    lampEls.forEach((l) => l.classList.toggle('on', !!ch && l.dataset.k === ch.key));
    stName.textContent = ch ? ch.name.toUpperCase() : 'LIGHTS OFF';
    stName.style.color = ch ? (ch.key === 'red' ? 'var(--red)' : ch.key === 'green' ? 'var(--green)' : 'var(--amber)') : 'var(--muted)';
    stWord.textContent = ch ? ch.word : (STEPS[stepIndex].stage === 2 ? 'Building the circuit' : 'Program not running');
    stCount.innerHTML = ch ? `${secs}<small>s</small>` : '';
    stCount.hidden = !ch;
    stBadge.hidden = !(paused || seq.manual);
    stBadge.textContent = paused ? 'Paused' : 'Step-through';
    cycleEl.hidden = !running;
    cycleSegs.forEach((d, k) => d.classList.toggle('on', running && k === seq.phase));
    document.querySelectorAll('#phaseList li').forEach((li) => li.classList.toggle('on', running && +li.dataset.phase === seq.phase));
  }
  if (running) {
    const durs = [5, greenDur, 2], total = durs[0] + durs[1] + durs[2];
    let el = 0; for (let k = 0; k < seq.phase; k++) el += durs[k];
    el += durs[seq.phase] - Math.max(0, seq.remaining);
    const track = cycleMarker.parentElement;
    const gaps = 6;
    cycleMarker.style.left = `calc(${(el / total) * 100}% - ${(el / total) * gaps}px + ${seq.phase * 3}px)`;
    void track;
  }
}

/* =========================================================
   Main loop
   ========================================================= */
function resize() {
  const r = $('#viewport').getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 52 : 40;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('#viewport'));
resize();

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const dt = paused ? 0 : rdt;
  updateTweens(dt);
  updateCam(rdt);
  updateSeq(dt);
  updateFlow(dt);
  // housing lifts off while we build; enlarged LED grows in for stage B
  housing.position.y += (housingTarget - housing.position.y) * Math.min(1, rdt * 3.5);
  housing.visible = housing.position.y < 4.3;
  const s = bigLed.scale.x + (Math.max(0.001, bigLedTarget) - bigLed.scale.x) * Math.min(1, rdt * 4);
  bigLed.scale.setScalar(s);
  bigLed.visible = s > 0.02;
  // Officer Ohm bobs and waves at each new step
  const tt = now / 1000;
  cop.position.y = -0.4 + Math.sin(tt * 2) * 0.03;
  const armR = cop.userData.armR;
  if (copWave > 0) { copWave -= rdt; armR.rotation.z = 2.5 + Math.sin(tt * 11) * 0.35; }
  else armR.rotation.z += (0.15 - armR.rotation.z) * Math.min(1, rdt * 5);
  for (const o of temps) if (o.userData.pulse) o.scale.setScalar(1 + 0.22 * Math.sin(tt * 6));
  if (selHelper) selHelper.update();
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  updateStatus();
  updateCodeHighlight();
  requestAnimationFrame(frame);
}

updateCycle(true);
goTo(0, { instant: true });
housing.position.y = housingTarget;
requestAnimationFrame(frame);

// expose a tiny hook for automated checks
window.__lesson = { goTo, get step() { return stepIndex; }, seq, setGreen, selectPart };
})();
</script>
</body>
</html>
